<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- PWA meta tags -->
    <meta name="theme-color" content="#060D08" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vertex" />
    <meta name="description" content="Dein persönlicher Produktivitäts-Tracker" />

    <link rel="apple-touch-icon" href="/favicon.ico" />
    <title>Vertex</title>

    <style>
      /* Ensure app fills entire viewport */
      *, *::before, *::after {
        box-sizing: border-box;
      }

      html {
        height: 100%;
        height: -webkit-fill-available;
        background-color: #060D08;
      }

      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: -webkit-fill-available;
        background-color: #060D08;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #root {
        display: flex;
        width: 100%;
        height: 100%;
        height: -webkit-fill-available;
        background-color: #060D08;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
