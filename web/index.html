<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!--
      viewport-fit=cover: App nutzt den vollen Bildschirm inkl. Notch-Bereich.
      Ohne das sitzt die Tab-Bar hinter dem Home-Indikator.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />

    <!-- PWA / iPhone -->
    <meta name="theme-color" content="#05060B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vertex" />
    <meta name="description" content="Dein persönlicher Produktivitäts-Tracker" />
    <link rel="apple-touch-icon" href="/icon.png" sizes="512x512" />

    <title>Vertex</title>

    <style>
      /* ── Reset & full-height ── */
      *, *::before, *::after { box-sizing: border-box; }

      html {
        height: 100%;
        background-color: #05060B;
        /* Prevent iOS text size adjustment when rotating */
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #05060B;
        overflow: hidden;
        /* Extend body into notch / home-indicator zones */
        padding-top:    env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left:   env(safe-area-inset-left);
        padding-right:  env(safe-area-inset-right);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #root {
        display: flex;
        height: 100%;
        background-color: #05060B;
      }

      /* ── App-like touch behaviour ── */

      /* Remove blue flash on tap */
      * { -webkit-tap-highlight-color: transparent; }

      /* Disable long-press context menu on images / links */
      * { -webkit-touch-callout: none; }

      /* Disable text selection everywhere (feels more native) */
      * { -webkit-user-select: none; user-select: none; }

      /* Re-enable selection inside text inputs */
      input, textarea {
        -webkit-user-select: text;
        user-select: text;
        /* font-size ≥ 16px prevents iOS auto-zoom on focus */
        font-size: 16px;
      }

      /* Smooth momentum scrolling for ScrollViews */
      div[style*="overflow"] {
        -webkit-overflow-scrolling: touch;
      }

      /* Prevent double-tap zoom */
      * { touch-action: manipulation; }
    </style>
  </head>
  <body>
    <noscript>JavaScript muss aktiviert sein.</noscript>
    <div id="root"></div>
  </body>
</html>
